[package]
name = "yappa-desktop"
description = "yAPPA desktop shell (Tauri 2). Thin: window, tray, hotkeys, updater; audio lives in the engine crates."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yappa_desktop_lib"
crate-type = ["rlib"]  # desktop only; mobile is a non-goal

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# Links in the in-app help open in the system browser (Rust side only, see `open_url`).
tauri-plugin-opener = "2"
# Invite links (`yappa://invite/…`) open the app; a second start hands its link to the first
# window instead of opening another one (U5).
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
api-types.workspace = true
client.workspace = true
audio-engine.workspace = true
engine-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
# The shell is where engine and media plane meet: it picks the LiveKit implementation.
transport = { workspace = true, features = ["livekit"] }

[lints]
workspace = true
