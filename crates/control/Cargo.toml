[package]
name = "control"
description = "yAPPA control plane: invites, members, channels, LiveKit tokens, remote config, event log (HTTP only, ADR-005)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yappa-control"
path = "src/main.rs"

[dependencies]
api-types.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
hex = "0.4"
livekit-api = { version = "0.8", default-features = false, features = ["access-token", "webhooks", "services", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
