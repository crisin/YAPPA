[package]
name = "denoise"
description = "Noise suppression behind one trait: RNNoise (nnnoiseless, light) and DeepFilterNet (libDF/tract, feature `deepfilter`). Loads models (I/O), so not part of dsp."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# DeepFilterNet 3, low-latency model, embedded in the binary. Adds ≈ 3 min to a clean
# release build (tract); measured in spike S2.
deepfilter = ["dep:deep_filter", "dep:ndarray", "dep:tract-core", "dep:tract-hir", "dep:tract-onnx", "dep:tract-pulse"]

[dependencies]
engine-protocol.workspace = true
nnnoiseless = { version = "0.5", default-features = false }
tracing.workspace = true
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model-ll"], optional = true }
ndarray = { version = "0.15", optional = true }
# libDF builds against tract 0.21.4 (its own Cargo.lock); 0.21.10 changed the API within the
# minor version. Pinned so the resolver picks what upstream tested.
tract-core = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }

[lints]
workspace = true
