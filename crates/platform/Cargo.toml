[package]
name = "platform"
description = "OS integration behind small traits (CLAUDE.md rule 3): global hotkeys for push-to-talk, later app-audio capture. A missing or failing implementation degrades the feature, never the call."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Low-level keyboard and mouse hooks (Windows: WH_KEYBOARD_LL / WH_MOUSE_LL with
# CallNextHookEx, so the game still gets the key; macOS: CGEventTap, needs the
# accessibility permission). MIT.
rdev = "0.5"
tracing.workspace = true

# Device hot-plug (A2): `IMMNotificationClient` on the MMDevice enumerator. Same version
# cpal already uses, so no second copy. MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
] }
# The `implement` macro refers to this crate by name.
windows-core = "0.62"

[lints]
workspace = true
