[package]
name = "spike-s6"
description = "S6 spike (scratch): control plane + presence room against a real LiveKit — attribute latency, late joiners, leave/drop/kick detection, token grants, webhooks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api-types.workspace = true
control = { path = "../control" }
livekit = { version = "0.9", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }

[lints]
workspace = true
