[package]
name = "client"
description = "Non-audio client logic (ADR-007): API client with cache, session in the OS credential store, presence room, app settings, profiles. No Tauri, no audio."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api-types.workspace = true
base64.workspace = true
engine-protocol.workspace = true
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
# `net` only: the name lookup that explains an unreachable server (IPv6-only host?).
tokio = { version = "1", features = ["net"] }
tracing.workspace = true
transport = { workspace = true, features = ["livekit"] }
ts-rs.workspace = true

[dev-dependencies]
control = { path = "../control" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
