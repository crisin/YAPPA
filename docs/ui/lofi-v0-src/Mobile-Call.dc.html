<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mobile im Call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F2; color: #1F1F1D; font-family: Inter, system-ui, sans-serif; font-size: 15px; overflow: hidden">
  <div style="height: 47px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 16px 12px">
    <span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #CFCFC8"></span>
    <div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
      <a href="Mobile-Channels.dc.html" aria-label="Call minimieren" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #CFCFC8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F1F1D"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></a>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-weight: 700; font-size: 18px">Raid-Abend</span>
        <span style="font-size: 12px; color: #5C5C57">18 ms · Verbindung gut</span>
      </div>
      <button aria-label="Einladen" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #CFCFC8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F1F1D"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </header>
  <div style="flex: 1; overflow: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 12px; border-radius: 14px; background: #FFFFFF; border: {{p.border}}">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: #CFCFC8; display: flex; align-items: center; justify-content: center; font-weight: 600">{{p.i}}</span>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-weight: 600">{{p.name}}</span>
          <span style="font-size: 12px; color: #5C5C57">{{p.tag}}</span>
        </span>
        <button aria-label="Lautstärke für {{p.name}}" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #F5F5F2; display: flex; align-items: center; justify-content: center; color: #1F1F1D"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
      </div>
    </sc-for>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #CFCFC8">
      <span style="width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid #8A8A84; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Ableton Live</span><span style="font-size: 12px; color: #5C5C57">App-Audio von Krille · nur hören</span></span>
    </div>
  </div>
  <div style="flex-shrink: 0; padding: 16px 20px 34px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid #CFCFC8; background: #FAFAF8">
    <div role="group" aria-label="Sprechmodus" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E7E7E2">
      <button style="height: 40px; border-radius: 9px; border: 0; background: #FFFFFF; font: 600 13px Inter, sans-serif; color: #1F1F1D">Offenes Mikro</button>
      <button style="height: 40px; border-radius: 9px; border: 0; background: transparent; font: 500 13px Inter, sans-serif; color: #1F1F1D">Zum Sprechen halten</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Soundboard" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #CFCFC8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F1F1D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
      <button aria-label="Lautsprecher wählen" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #CFCFC8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F1F1D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg></button>
      <button aria-label="Mikro stummschalten" style="width: 84px; height: 84px; border-radius: 50%; border: 0; background: #1F1F1D; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <a href="Mobile-Channels.dc.html" style="width: 116px; height: 56px; border-radius: 28px; border: 2px solid #1F1F1D; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F1F1D; font: 600 14px Inter, sans-serif; text-decoration: none">Verlassen</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = '1px solid #CFCFC8';
    return {
      people: [
        { i: 'B', name: 'Ben', tag: 'spricht', border: '3px solid #1D4ED8' },
        { i: 'K', name: 'Krille (du)', tag: 'offenes Mikro', border: n },
        { i: 'S', name: 'Sasha', tag: ' ', border: n },
        { i: 'T', name: 'Tim', tag: 'stumm', border: '1.5px dashed #8A8A84' },
        { i: 'L', name: 'Lea', tag: 'Push-to-Talk', border: n }
      ]
    };
  }
}
</script>
</body>
</html>
