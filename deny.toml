# cargo deny check — licenses, advisories, banned/duplicate crates, sources.
# Part of `cargo xtask check`. The license list is the guard for the open license question
# (ADR-000): copyleft (GPL/AGPL, e.g. VST3 SDK bindings) must not slip in unnoticed.

[graph]
all-features = false
# Only the platforms we ship. Tauri's Linux stack (gtk-rs, webkit2gtk) is out of scope and
# carries unmaintained crates (e.g. RUSTSEC-2024-0370 proc-macro-error via gtk3-macros).
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# DeepFilterNet (libDF, crates/denoise feature `deepfilter`) only builds against tract 0.21.4
# (ADR-008). Accepted until libDF runs on tract >= 0.21.16 — then these three go.
ignore = [
  # tract-nnef: overflow when parsing a crafted NNEF model. We load no NNEF and no model
  # from outside: the ONNX model is embedded in the binary at build time.
  { id = "RUSTSEC-2026-0217", reason = "tract-nnef NNEF parser; only the embedded ONNX model is loaded (ADR-008)" },
  # Unmaintained, no known vulnerability: build-time templating of tract-linalg, and a macro crate.
  { id = "RUSTSEC-2026-0319", reason = "anymap2, build dependency of tract-linalg 0.21.4 (ADR-008)" },
  { id = "RUSTSEC-2024-0436", reason = "paste, proc-macro via tract 0.21.4 (ADR-008)" },
  # zip 4 via tauri-plugin-updater 2.14 (D1): the three extraction advisories concern
  # attacker-controlled archives; the updater only extracts bundles whose minisign
  # signature it verified against our public key first. Go when the plugin moves to zip 9.
  { id = "RUSTSEC-2026-0367", reason = "zip 4 in tauri-plugin-updater; only signature-verified bundles are extracted (ADR-006)" },
  { id = "RUSTSEC-2026-0368", reason = "zip 4 in tauri-plugin-updater; only signature-verified bundles are extracted (ADR-006)" },
  { id = "RUSTSEC-2026-0369", reason = "zip 4 in tauri-plugin-updater; only signature-verified bundles are extracted (ADR-006)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
